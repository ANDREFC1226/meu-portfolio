<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificados - macOS Portfolio</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/windows.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="apple-logo"></span>
      <span class="app-name">Meu Portfólio</span>
    </div>
    <div class="top-bar-center">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar certificado...">
    </div>
    <div class="top-bar-right">
      <span id="statsBar" class="stats-bar"></span>
      <span id="clock">00:00</span>
    </div>
  </header>

  <main class="desktop" id="desktop"></main>

  <nav class="dock" id="dock"></nav>

  <div class="window-overlay" id="windowOverlay"></div>
  <div class="mac-window" id="certWindow">
    <div class="window-header">
      <div class="traffic-lights">
        <button class="dot dot-close" id="btnClose" title="Fechar"></button>
        <button class="dot dot-minimize" title="Minimizar"></button>
        <button class="dot dot-expand" title="Expandir"></button>
      </div>
      <div class="window-title" id="windowTitle">Visualizador de Certificados</div>
    </div>
    <iframe class="window-body" id="pdfFrame" src="about:blank" title="Certificado"></iframe>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
