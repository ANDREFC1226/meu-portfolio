<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificados - macOS Portfolio</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/windows.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="apple-logo"></span>
    </div>
    <div class="top-bar-center">
      <span id="titleAnimated" class="title-animated">Meu Portfólio</span>
    </div>
    <div class="top-bar-right">
      <span id="statsBar" class="stats-bar"></span>
      <span id="clock">00:00</span>
    </div>
  </header>

  <main class="desktop" id="desktop"></main>

  <nav class="dock" id="dock"></nav>

  <div id="windowLayer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
